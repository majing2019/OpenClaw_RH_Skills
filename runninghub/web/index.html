<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览 RunningHub Skill 的标准能力、AI 应用与实时 RHTV 工作流。">
  <title>RunningHub 能力浏览器</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6b35'/%3E%3Cpath d='M8 9h9a6 6 0 0 1 0 12h-3l5 5h-5l-6-7h9a2 2 0 1 0 0-4H8z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --panel: #0d1822;
      --panel-2: #111f2b;
      --line: #243444;
      --text: #edf5fb;
      --muted: #92a7b8;
      --orange: #ff6b35;
      --cyan: #38d6d9;
      --green: #61d38a;
      --danger: #ff7384;
      --radius: 16px;
      --shadow: 0 18px 50px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 16px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 85% -10%, rgba(56, 214, 217, .12), transparent 34rem),
        radial-gradient(circle at 10% 10%, rgba(255, 107, 53, .13), transparent 30rem),
        var(--bg);
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1480px, 100%); margin: 0 auto; padding: 22px; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .mark {
      width: 44px; height: 44px; border-radius: 13px; flex: none;
      display: grid; place-items: center; font-weight: 900; font-size: 20px;
      background: linear-gradient(145deg, var(--orange), #ff3f2f); box-shadow: 0 10px 30px rgba(255, 107, 53, .22);
    }
    h1 { margin: 0; font-size: clamp(20px, 2.3vw, 28px); line-height: 1.1; letter-spacing: -.02em; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .status-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .status {
      display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 5px 10px;
      border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(13, 24, 34, .8); font-size: 13px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #60717f; }
    .status.on .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(97, 211, 138, .1); }
    .tabs {
      display: flex; gap: 4px; padding: 5px; width: fit-content; max-width: 100%; overflow-x: auto;
      background: #09141e; border: 1px solid var(--line); border-radius: 13px; margin-bottom: 18px;
    }
    .tab {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      padding: 9px 15px; border-radius: 9px; white-space: nowrap; font-weight: 650;
    }
    .tab[aria-selected="true"] { background: var(--panel-2); color: white; box-shadow: inset 0 0 0 1px #304457; }
    .view[hidden] { display: none; }
    .toolbar {
      display: grid; grid-template-columns: minmax(220px, 1.7fr) repeat(2, minmax(150px, .7fr)) auto;
      gap: 10px; padding: 13px; background: rgba(13, 24, 34, .88); border: 1px solid var(--line); border-radius: var(--radius);
      position: sticky; top: 10px; z-index: 5; backdrop-filter: blur(14px); box-shadow: var(--shadow);
    }
    .field { position: relative; }
    .field .search-icon { position: absolute; left: 13px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
    input, select {
      width: 100%; min-height: 43px; border: 1px solid var(--line); border-radius: 11px;
      background: #07121b; color: var(--text); padding: 9px 12px; outline: none;
    }
    .field input { padding-left: 39px; }
    input:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56, 214, 217, .12); }
    .ghost, .primary {
      min-height: 43px; border-radius: 11px; padding: 9px 14px; cursor: pointer; font-weight: 700;
    }
    .ghost { background: #101d28; border: 1px solid var(--line); }
    .ghost:hover { border-color: #476177; }
    .primary { border: 0; color: #081116; background: linear-gradient(135deg, var(--cyan), #76f1d0); }
    .summary { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin: 22px 2px 12px; }
    .summary h2 { margin: 0; font-size: 18px; }
    .summary p { margin: 0; color: var(--muted); font-size: 14px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 12px; }
    .card {
      min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, rgba(17,31,43,.98), rgba(10,21,30,.98));
      padding: 16px; cursor: pointer; transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #3d586c; background: #122433; }
    .card:focus-visible { outline: 3px solid rgba(56, 214, 217, .35); outline-offset: 2px; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .card h3 { margin: 0; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
    .endpoint { color: var(--muted); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 10px 0; overflow-wrap: anywhere; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { border: 1px solid #2c4153; color: #b8cbd8; background: #0a1721; border-radius: 999px; padding: 3px 8px; font-size: 12px; }
    .type { color: #071018; background: var(--cyan); border: 0; font-weight: 800; text-transform: uppercase; }
    .type.video { background: #a78bfa; } .type.image { background: #ff9d6e; } .type.audio { background: #6ee7b7; }
    .type.string { background: #7dd3fc; } .type.\33 d { background: #facc15; }
    .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .empty, .notice {
      border: 1px dashed #395064; background: rgba(13, 24, 34, .72); border-radius: var(--radius); padding: 26px;
      color: var(--muted); text-align: center;
    }
    .notice { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
    .notice strong { color: var(--text); display: block; margin-bottom: 4px; }
    .app-controls { display: flex; flex-wrap: wrap; gap: 9px; }
    .seg {
      border: 1px solid var(--line); background: #0b1822; color: var(--muted); border-radius: 10px; padding: 8px 12px; cursor: pointer;
    }
    .seg.active { color: #071018; background: var(--orange); border-color: var(--orange); font-weight: 800; }
    .app-card { padding: 0; overflow: hidden; }
    .cover { aspect-ratio: 16/9; background: #132431; overflow: hidden; border-bottom: 1px solid var(--line); }
    .cover img, .cover video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-fallback { height: 100%; display: grid; place-items: center; color: #6f8798; font-weight: 800; letter-spacing: .08em; }
    .app-copy { padding: 15px; }
    .app-copy p { color: var(--muted); margin: 8px 0 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 18px; }
    .rhtv-toolbar { margin-top: 14px; grid-template-columns: minmax(220px, 1.7fr) minmax(150px, .7fr) auto; }
    .rhtv-card { padding: 0; overflow: hidden; }
    .rhtv-card .cover { position: relative; }
    .preview-badge { position: absolute; right: 9px; top: 9px; padding: 3px 8px; border-radius: 999px; background: rgba(3, 11, 17, .82); border: 1px solid rgba(255,255,255,.18); color: #dcebf5; font-size: 11px; }
    .rhtv-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 12px; }
    .detail-preview { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: #07121b; margin-bottom: 16px; }
    .detail-preview img, .detail-preview video { width: 100%; max-height: 420px; object-fit: contain; display: block; }
    .detail-section { margin-top: 18px; }
    .detail-section h3 { margin: 0 0 9px; font-size: 15px; }
    .io-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .io-box { padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: #09151e; }
    .io-box strong { display: block; margin-bottom: 8px; }
    .io-item { padding: 8px 0; border-top: 1px solid #1d3040; }
    .io-item:first-of-type { border-top: 0; }
    .io-item span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
    .action-link { display: inline-flex; align-items: center; justify-content: center; min-height: 43px; padding: 9px 14px; border-radius: 11px; color: #071018; background: var(--cyan); text-decoration: none; font-weight: 750; }
    .fine-print { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    pre { overflow: auto; padding: 15px; border-radius: 12px; background: #050c12; border: 1px solid var(--line); color: #b9f5e4; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
    dialog { width: min(760px, calc(100% - 24px)); max-height: min(84vh, 900px); padding: 0; color: var(--text); background: var(--panel); border: 1px solid #344a5c; border-radius: 18px; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
    dialog::backdrop { background: rgba(0, 5, 10, .76); backdrop-filter: blur(5px); }
    .dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
    .dialog-head h2 { margin: 0; font-size: 20px; overflow-wrap: anywhere; }
    .dialog-head p { margin: 7px 0 0; color: var(--muted); font: 12px/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
    .close { width: 38px; height: 38px; flex: none; border: 1px solid var(--line); background: #0a151e; border-radius: 10px; cursor: pointer; font-size: 21px; }
    .dialog-body { padding: 20px; }
    .params { display: grid; gap: 8px; margin-top: 16px; }
    .param { display: grid; grid-template-columns: minmax(140px, .8fr) minmax(180px, 1.4fr) auto; gap: 12px; align-items: start; padding: 11px 12px; background: #09151e; border: 1px solid #1f3140; border-radius: 11px; }
    .param code { color: #d5f7ec; overflow-wrap: anywhere; }
    .param small { color: var(--muted); overflow-wrap: anywhere; }
    .required { color: var(--orange); font-size: 12px; }
    .skeleton { min-height: 240px; background: linear-gradient(90deg, #101f2b 25%, #172b39 50%, #101f2b 75%); background-size: 200% 100%; animation: pulse 1.2s infinite; border-radius: var(--radius); }
    @keyframes pulse { to { background-position: -200% 0; } }
    @media (max-width: 860px) {
      header { align-items: flex-start; flex-direction: column; }
      .status-row { justify-content: flex-start; }
      .toolbar { grid-template-columns: 1fr 1fr; position: static; }
      .field { grid-column: 1 / -1; }
      .rhtv-toolbar { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .shell { padding: 14px; }
      .toolbar { grid-template-columns: 1fr; }
      .field { grid-column: auto; }
      .cards { grid-template-columns: 1fr; }
      .notice { align-items: flex-start; flex-direction: column; }
      .param { grid-template-columns: 1fr; gap: 4px; }
      .rhtv-toolbar { grid-template-columns: 1fr; }
      .io-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">RH</div>
        <div><h1>RunningHub 能力浏览器</h1><p>标准能力、AI 应用与 RHTV 实时工作流，一处查清。</p></div>
      </div>
      <div class="status-row" aria-label="连接状态">
        <span class="status" id="catalogStatus"><span class="dot"></span><span>能力目录载入中</span></span>
        <span class="status" id="apiStatus"><span class="dot"></span><span>AI 应用未检查</span></span>
        <span class="status" id="rhtvStatus"><span class="dot"></span><span>RHTV 实时目录待加载</span></span>
      </div>
    </header>

    <nav class="tabs" aria-label="功能区域" role="tablist">
      <button class="tab" role="tab" aria-selected="true" aria-controls="capabilities" data-tab="capabilities">标准能力</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="apps" data-tab="apps">AI 应用</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="rhtv" data-tab="rhtv">RHTV</button>
    </nav>

    <section class="view" id="capabilities" role="tabpanel">
      <div class="toolbar">
        <label class="field"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索名称、任务、端点或标签" aria-label="搜索能力"></label>
        <label><span hidden>输出类型</span><select id="typeFilter" aria-label="输出类型"><option value="">全部输出类型</option></select></label>
        <label><span hidden>任务类型</span><select id="taskFilter" aria-label="任务类型"><option value="">全部任务</option></select></label>
        <button class="ghost" id="resetFilters">重置</button>
      </div>
      <div class="summary"><h2>可用能力</h2><p id="capSummary">正在读取目录…</p></div>
      <div class="cards" id="capCards" aria-live="polite"></div>
    </section>

    <section class="view" id="apps" role="tabpanel" hidden>
      <div class="notice" id="appNotice">
        <div><strong>实时 AI 应用目录</strong><span id="appNoticeText">正在检查 API 配置…</span></div>
        <button class="primary" id="loadApps">加载应用</button>
      </div>
      <div class="summary"><div><h2>AI 应用</h2><div class="app-controls" style="margin-top:12px"><button class="seg active" data-sort="RECOMMEND">推荐</button><button class="seg" data-sort="HOTTEST">热门</button><button class="seg" data-sort="NEWEST">最新</button></div></div><p id="appSummary"></p></div>
      <div class="cards" id="appCards" aria-live="polite"></div>
      <div class="pager" id="appPager" hidden><button class="ghost" id="prevPage">上一页</button><span id="pageLabel"></span><button class="ghost" id="nextPage">下一页</button></div>
    </section>

    <section class="view" id="rhtv" role="tabpanel" hidden>
      <div class="notice">
        <div><strong>RHTV 工作流目录</strong><span>公开目录增量保存到本地数据库；刷新时只写入新增或有变化的工作流。</span></div>
        <button class="primary" id="loadRhtv">刷新目录</button>
      </div>
      <div class="toolbar rhtv-toolbar">
        <label class="field"><span class="search-icon" aria-hidden="true">⌕</span><input id="rhtvSearch" type="search" placeholder="搜索工作流、说明、模型或输出类型" aria-label="搜索 RHTV 工作流"></label>
        <label><span hidden>输出类型</span><select id="rhtvType" aria-label="RHTV 输出类型"><option value="">全部输出类型</option><option value="image">图片</option><option value="video">视频</option><option value="audio">音频</option><option value="string">文本</option><option value="3d">3D</option></select></label>
        <button class="ghost" id="resetRhtv">重置</button>
      </div>
      <div class="summary"><h2>全部 RHTV 工作流</h2><p id="rhtvSummary">切换到本页后实时加载…</p></div>
      <div class="cards" id="rhtvCards" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="detailDialog" aria-labelledby="detailTitle">
    <div class="dialog-head"><div><h2 id="detailTitle"></h2><p id="detailSub"></p></div><button class="close" aria-label="关闭详情">×</button></div>
    <div class="dialog-body" id="detailBody"></div>
  </dialog>

  <script>
    const state = { capabilities: [], filtered: [], status: null, appSort: 'RECOMMEND', appPage: 1, appData: null, rhtvData: null, rhtvFiltered: [] };
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => [...document.querySelectorAll(selector)];
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const typeNames = { image:'图片', video:'视频', audio:'音频', '3d':'3D', string:'文本' };

    function setStatus(element, on, text) {
      element.classList.toggle('on', Boolean(on));
      element.querySelector('span:last-child').textContent = text;
    }

    async function fetchJson(url) {
      const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || `请求失败 (${response.status})`);
      return data;
    }

    async function init() {
      try {
        const [status, catalog] = await Promise.all([fetchJson('/api/status'), fetchJson('/api/capabilities')]);
        state.status = status;
        state.capabilities = catalog.endpoints || [];
        setStatus($('#catalogStatus'), true, `${catalog.total || state.capabilities.length} 项 · ${catalog.version || '本地目录'}`);
        setStatus($('#apiStatus'), status.apiConfigured, status.apiConfigured ? 'AI 应用已连接' : 'AI 应用未配置');
        setStatus($('#rhtvStatus'), false, 'RHTV 本地目录待加载');
        $('#appNoticeText').textContent = status.apiConfigured ? '已检测到本地 API Key，可加载 RunningHub 当前公开应用。' : '需要在启动服务前设置 RUNNINGHUB_API_KEY；密钥不会传给网页。';
        $('#loadApps').disabled = !status.apiConfigured;
        populateFilters();
        applyFilters();
      } catch (error) {
        setStatus($('#catalogStatus'), false, '目录载入失败');
        $('#capCards').innerHTML = `<div class="empty">${escapeHtml(error.message)}<br>请通过 catalog_server.py 打开此页面。</div>`;
      }
    }

    function populateFilters() {
      const types = [...new Set(state.capabilities.map(item => item.output_type).filter(Boolean))].sort();
      const tasks = [...new Set(state.capabilities.map(item => item.task).filter(Boolean))].sort();
      $('#typeFilter').insertAdjacentHTML('beforeend', types.map(type => `<option value="${escapeHtml(type)}">${escapeHtml(typeNames[type] || type)}</option>`).join(''));
      $('#taskFilter').insertAdjacentHTML('beforeend', tasks.map(task => `<option value="${escapeHtml(task)}">${escapeHtml(task)}</option>`).join(''));
    }

    function applyFilters() {
      const query = $('#search').value.trim().toLowerCase();
      const type = $('#typeFilter').value;
      const task = $('#taskFilter').value;
      state.filtered = state.capabilities.filter(item => {
        const haystack = [item.name_cn, item.name_en, item.endpoint, item.task, item.category, ...(item.tags || [])].join(' ').toLowerCase();
        return (!query || haystack.includes(query)) && (!type || item.output_type === type) && (!task || item.task === task);
      });
      renderCapabilities();
    }

    function renderCapabilities() {
      $('#capSummary').textContent = `显示 ${state.filtered.length} / ${state.capabilities.length} 项`;
      if (!state.filtered.length) {
        $('#capCards').innerHTML = '<div class="empty">没有匹配的能力，试试更短的关键词或重置筛选。</div>';
        return;
      }
      $('#capCards').innerHTML = state.filtered.map((item, index) => `
        <article class="card" tabindex="0" data-cap-index="${index}">
          <div class="card-head"><h3>${escapeHtml(item.name_cn || item.name_en || item.endpoint)}</h3><span class="pill type ${escapeHtml(item.output_type)}">${escapeHtml(typeNames[item.output_type] || item.output_type)}</span></div>
          <p class="endpoint">${escapeHtml(item.endpoint)}</p>
          <div class="pills"><span class="pill">${escapeHtml(item.task)}</span>${(item.tags || []).slice(0,3).map(tag => `<span class="pill">${escapeHtml(tag)}</span>`).join('')}</div>
          <div class="count" style="margin-top:12px">${(item.params || []).length} 个参数</div>
        </article>`).join('');
      $$('[data-cap-index]').forEach(card => {
        const open = () => openCapability(state.filtered[Number(card.dataset.capIndex)]);
        card.addEventListener('click', open);
        card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } });
      });
    }

    function openCapability(item) {
      $('#detailTitle').textContent = item.name_cn || item.name_en || item.endpoint;
      $('#detailSub').textContent = item.endpoint;
      const params = item.params || [];
      $('#detailBody').innerHTML = `
        <div class="pills"><span class="pill type ${escapeHtml(item.output_type)}">${escapeHtml(typeNames[item.output_type] || item.output_type)}</span><span class="pill">${escapeHtml(item.task)}</span><span class="pill">${escapeHtml(item.category || '未分类')}</span></div>
        <div class="params">${params.length ? params.map(param => `
          <div class="param"><code>${escapeHtml(param.key)}</code><small>${escapeHtml(formatParam(param))}</small><span class="${param.required ? 'required' : ''}">${param.required ? '必填' : '可选'}</span></div>`).join('') : '<div class="empty">该端点没有公开参数。</div>'}</div>`;
      $('#detailDialog').showModal();
    }

    function formatParam(param) {
      const parts = [param.type];
      if (param.default !== undefined) parts.push(`默认 ${JSON.stringify(param.default)}`);
      if (param.options?.length) parts.push(`选项：${param.options.join(' / ')}`);
      if (param.multiple) parts.push(`最多 ${param.maxCount || '多个'} 输入`);
      if (param.maxSizeMB) parts.push(`最大 ${param.maxSizeMB}MB`);
      if (param.min !== undefined || param.max !== undefined) parts.push(`范围 ${param.min ?? '不限'}–${param.max ?? '不限'}`);
      return parts.join(' · ');
    }

    async function loadApps() {
      if (!state.status?.apiConfigured) return;
      $('#appCards').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      $('#appSummary').textContent = '载入中…';
      try {
        const data = await fetchJson(`/api/apps?sort=${state.appSort}&size=12&page=${state.appPage}&days=7`);
        state.appData = data;
        renderApps();
      } catch (error) {
        $('#appCards').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
        $('#appSummary').textContent = '加载失败';
      }
    }

    function renderApps() {
      const data = state.appData || { apps: [] };
      $('#appSummary').textContent = `共 ${data.total || data.apps.length} 个 · 第 ${data.page || state.appPage} 页`;
      $('#appCards').innerHTML = data.apps.length ? data.apps.map((app, index) => `
        <article class="card app-card" tabindex="0" data-app-index="${index}">
          <div class="cover">${app.coverUrl ? `<img src="${escapeHtml(app.coverUrl)}" alt="" loading="lazy">` : '<div class="cover-fallback">RUNNINGHUB</div>'}</div>
          <div class="app-copy"><h3>${escapeHtml(app.title || '未命名应用')}</h3><p>${escapeHtml(app.description || '暂无说明')}</p></div>
        </article>`).join('') : '<div class="empty">当前分类没有可显示的应用。</div>';
      $$('[data-app-index]').forEach(card => {
        const open = () => openApp(data.apps[Number(card.dataset.appIndex)]);
        card.addEventListener('click', open);
        card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } });
      });
      $('#appPager').hidden = !(data.pages > 1 || data.hasNext || state.appPage > 1);
      $('#pageLabel').textContent = `第 ${state.appPage} 页${data.pages ? ` / ${data.pages}` : ''}`;
      $('#prevPage').disabled = state.appPage <= 1;
      $('#nextPage').disabled = !data.hasNext && data.pages && state.appPage >= data.pages;
    }

    async function openApp(app) {
      $('#detailTitle').textContent = app.title || 'AI 应用';
      $('#detailSub').textContent = '正在读取可修改节点…';
      $('#detailBody').innerHTML = '<div class="skeleton"></div>';
      $('#detailDialog').showModal();
      if (!app.webappId) {
        $('#detailSub').textContent = '此应用没有公开调用 ID';
        $('#detailBody').innerHTML = '<div class="empty">暂时无法读取应用节点。</div>';
        return;
      }
      try {
        const data = await fetchJson(`/api/apps/${app.webappId}`);
        $('#detailSub').textContent = `${data.nodeCount || 0} 个可修改节点`;
        $('#detailBody').innerHTML = `<div class="params">${(data.nodes || []).map(node => `
          <div class="param"><code>${escapeHtml(node.description || node.nodeName || node.fieldName)}</code><small>${escapeHtml(node.fieldType || '')}${node.fieldValue !== undefined ? ` · 当前 ${JSON.stringify(node.fieldValue)}` : ''}</small><span></span></div>`).join('') || '<div class="empty">没有公开可修改节点。</div>'}</div>`;
      } catch (error) {
        $('#detailSub').textContent = '节点读取失败';
        $('#detailBody').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    async function loadRhtv(force = false) {
      $('#rhtvCards').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      $('#rhtvSummary').textContent = force ? '正在比对公开目录并增量更新…' : '正在读取本地目录…';
      $('#loadRhtv').disabled = true;
      try {
        state.rhtvData = await fetchJson(`/api/rhtv/workflows${force ? '?refresh=1' : ''}`);
        applyRhtvFilters();
        setStatus($('#rhtvStatus'), true, `RHTV ${state.rhtvData.total || state.rhtvData.count || 0} 个已缓存工作流`);
      } catch (error) {
        $('#rhtvCards').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
        $('#rhtvSummary').textContent = '实时目录加载失败';
        setStatus($('#rhtvStatus'), false, 'RHTV 目录加载失败');
      } finally {
        $('#loadRhtv').disabled = false;
      }
    }

    function applyRhtvFilters() {
      if (!state.rhtvData) return;
      const query = $('#rhtvSearch').value.trim().toLowerCase();
      const type = $('#rhtvType').value;
      state.rhtvFiltered = (state.rhtvData.workflows || []).filter(item => {
        const haystack = [item.name, item.description, item.chineseDescription, ...(item.models || []), ...(item.outputTypes || [])].join(' ').toLowerCase();
        return (!query || haystack.includes(query)) && (!type || (item.outputTypes || []).includes(type));
      });
      renderRhtv();
    }

    function rhtvPreview(item, detail = false) {
      if (!item.thumbnail) return '<div class="cover-fallback">RHTV</div>';
      if (item.previewType === 'video') {
        return `<video ${detail ? 'src' : 'data-preview-src'}="${escapeHtml(item.thumbnail)}" muted loop playsinline ${detail ? 'controls autoplay' : 'preload="none"'}></video>`;
      }
      if (item.previewType === 'image') return `<img src="${escapeHtml(item.thumbnail)}" alt="" loading="lazy">`;
      return '<div class="cover-fallback">RHTV</div>';
    }

    function renderRhtv() {
      const total = state.rhtvData?.total || state.rhtvData?.count || 0;
      const sync = state.rhtvData?.sync;
      const syncText = sync ? ` · 上次同步：新增 ${sync.created}，更新 ${sync.updated}，未变化 ${sync.unchanged}` : '';
      $('#rhtvSummary').textContent = `显示 ${state.rhtvFiltered.length} / ${total} 项 · 本地增量目录${syncText}`;
      if (!state.rhtvFiltered.length) {
        $('#rhtvCards').innerHTML = '<div class="empty">没有匹配的 RHTV 工作流，试试更短的关键词或重置筛选。</div>';
        return;
      }
      $('#rhtvCards').innerHTML = state.rhtvFiltered.map((item, index) => `
        <article class="card rhtv-card" tabindex="0" data-rhtv-index="${index}">
          <div class="cover">${rhtvPreview(item)}${item.previewType === 'video' ? '<span class="preview-badge">悬停预览</span>' : ''}</div>
          <div class="app-copy">
            <div class="card-head"><h3>${escapeHtml(item.name || '未命名工作流')}</h3><span class="count">#${escapeHtml(item.id)}</span></div>
            <p>${escapeHtml(item.chineseDescription || item.description || '暂无中文说明')}</p>
            <div class="pills" style="margin-top:12px">${(item.outputTypes || []).map(type => `<span class="pill type ${escapeHtml(type)}">${escapeHtml(typeNames[type] || type)}</span>`).join('') || '<span class="pill">未识别输出</span>'}${(item.models || []).slice(0,2).map(model => `<span class="pill">${escapeHtml(model)}</span>`).join('')}</div>
            <div class="rhtv-meta"><span>${item.nodeCount || 0} 节点 · ${item.edgeCount || 0} 连线</span><span>${escapeHtml(item.updateTime || '')}</span></div>
          </div>
        </article>`).join('');
      $$('[data-rhtv-index]').forEach(card => {
        const item = state.rhtvFiltered[Number(card.dataset.rhtvIndex)];
        const video = card.querySelector('video[data-preview-src]');
        if (video) {
          card.addEventListener('mouseenter', () => { if (!video.src) video.src = video.dataset.previewSrc; video.play().catch(() => {}); });
          card.addEventListener('mouseleave', () => video.pause());
        }
        const open = () => openRhtv(item);
        card.addEventListener('click', open);
        card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } });
      });
    }

    function renderIoItems(items, emptyText) {
      return items?.length ? items.map(entry => `<div class="io-item"><b>${escapeHtml(entry.label)}</b><span>${escapeHtml(entry.description || '')}</span>${entry.modelCode ? `<span>模型：${escapeHtml(entry.modelCode)}</span>` : ''}</div>`).join('') : `<span class="fine-print">${escapeHtml(emptyText)}</span>`;
    }

    async function openRhtv(item) {
      $('#detailTitle').textContent = item.name || 'RHTV 工作流';
      $('#detailSub').textContent = `RHTV 公开目录 #${item.id} · 正在读取节点…`;
      $('#detailBody').innerHTML = '<div class="skeleton"></div>';
      $('#detailDialog').showModal();
      try {
        const data = await fetchJson(`/api/rhtv/workflows/${item.id}`);
        $('#detailSub').textContent = `RHTV 公开目录 #${data.id} · ${data.nodeCount || 0} 个节点 · 只读浏览`;
        $('#detailBody').innerHTML = `
          ${data.thumbnail ? `<div class="detail-preview">${rhtvPreview(data, true)}</div>` : ''}
          <div class="pills">${(data.outputTypes || []).map(type => `<span class="pill type ${escapeHtml(type)}">${escapeHtml(typeNames[type] || type)}</span>`).join('')}${(data.models || []).map(model => `<span class="pill">${escapeHtml(model)}</span>`).join('')}</div>
          <p>${escapeHtml(data.chineseDescription || '暂未生成中文说明。')}</p>
          ${data.description ? `<p class="fine-print">目录原始说明：${escapeHtml(data.description)}</p>` : ''}
          <div class="detail-section"><h3>输入与输出</h3><div class="io-grid">
            <div class="io-box"><strong>输入</strong>${renderIoItems(data.inputs, '未识别到明确的输入节点')}</div>
            <div class="io-box"><strong>输出</strong>${renderIoItems(data.outputs, '未识别到明确的输出节点')}</div>
          </div></div>
          <div class="detail-section"><h3>官方 RHTV 工作流库</h3>
            <a class="action-link" href="${escapeHtml(data.sourceUrl)}" target="_blank" rel="noopener noreferrer">打开官方 RHTV 工作流库</a>
          </div>
          <div class="detail-section"><h3>节点结构</h3><div class="params">${(data.nodes || []).map(node => `
            <div class="param"><code>${escapeHtml(node.label || node.type || node.id)}</code><small>${escapeHtml([node.nodeType, node.subType, node.modelCode].filter(Boolean).join(' · '))}</small><span>${escapeHtml(node.id)}</span></div>`).join('') || '<div class="empty">没有可显示的节点。</div>'}</div></div>`;
      } catch (error) {
        $('#detailSub').textContent = '工作流详情读取失败';
        $('#detailBody').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function activateTab(tabName) {
      const tab = $(`.tab[data-tab="${tabName}"]`);
      if (!tab) return;
      $$('.tab').forEach(item => item.setAttribute('aria-selected', String(item === tab)));
      $$('.view').forEach(view => view.hidden = view.id !== tabName);
    }

    $$('.tab').forEach(tab => tab.addEventListener('click', () => {
      activateTab(tab.dataset.tab);
      if (tab.dataset.tab === 'apps' && state.status?.apiConfigured && !state.appData) loadApps();
      if (tab.dataset.tab === 'rhtv' && !state.rhtvData) loadRhtv();
    }));
    ['input','change'].forEach(event => $('#search').addEventListener(event, applyFilters));
    $('#typeFilter').addEventListener('change', applyFilters);
    $('#taskFilter').addEventListener('change', applyFilters);
    $('#resetFilters').addEventListener('click', () => { $('#search').value=''; $('#typeFilter').value=''; $('#taskFilter').value=''; applyFilters(); });
    $('#loadApps').addEventListener('click', loadApps);
    $('#loadRhtv').addEventListener('click', () => loadRhtv(true));
    $('#rhtvSearch').addEventListener('input', applyRhtvFilters);
    $('#rhtvType').addEventListener('change', applyRhtvFilters);
    $('#resetRhtv').addEventListener('click', () => { $('#rhtvSearch').value=''; $('#rhtvType').value=''; applyRhtvFilters(); });
    $$('.seg').forEach(button => button.addEventListener('click', () => { $$('.seg').forEach(item => item.classList.toggle('active', item === button)); state.appSort = button.dataset.sort; state.appPage = 1; loadApps(); }));
    $('#prevPage').addEventListener('click', () => { if (state.appPage > 1) { state.appPage--; loadApps(); } });
    $('#nextPage').addEventListener('click', () => { state.appPage++; loadApps(); });
    $('.close').addEventListener('click', () => $('#detailDialog').close());
    $('#detailDialog').addEventListener('click', event => { if (event.target === $('#detailDialog')) $('#detailDialog').close(); });
    init();
  </script>
</body>
</html>
